<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<table border=1 width=100>
		<tr th:each="map : ${map}">
			<td th:text="${map.key}"></td>
			<td>
				<table border=1 width=100>
					<tr th:each="list : ${map.value}">
						<td th:text="${list.name}"></td>
						<td th:text="${list.score}"></td>
					</tr>
				</table>
			</td>
		</tr>
		
	</table>
</body>
</html>
